[project]
name = "booklore-mcp"
version = "0.1.1"
description = "Local MCP server wrapping a self-hosted BookLore instance's REST API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Willian Paixão" }]
keywords = ["mcp", "booklore", "ebooks", "library", "fastmcp", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastmcp>=4.1",
    "httpx>=0.28",
    "structlog>=25.1",
]

[project.urls]
Homepage = "https://github.com/willianpaixao/booklore-mcp"
Repository = "https://github.com/willianpaixao/booklore-mcp"
Issues = "https://github.com/willianpaixao/booklore-mcp/issues"

[project.scripts]
booklore-mcp = "booklore_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booklore_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Put the repo root on sys.path so the backwards-compat `server.py` shim is importable
# in tests (the package itself is installed, so `booklore_mcp` resolves independently).
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["src/booklore_mcp", "server.py"]
ignore_missing_imports = true
check_untyped_defs = true
